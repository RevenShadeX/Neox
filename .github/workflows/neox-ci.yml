name: Neox CI
on:
  push:
    branches: [main, audit/global-stability-storage]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: |
          find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check
